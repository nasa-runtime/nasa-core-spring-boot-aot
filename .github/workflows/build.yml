name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp clean verify
      - if: matrix.java == '21'
        run: |
          jar tf target/nasa-core-spring-boot-aot-1.0.4.jar | grep -F META-INF/spring/aot.factories
          jar tf target/nasa-core-spring-boot-aot-1.0.4.jar | grep -F META-INF/README.md
          jar tf target/nasa-core-spring-boot-aot-1.0.4.jar | grep -F META-INF/LICENSE
          test -f target/nasa-core-spring-boot-aot-1.0.4-sources.jar
          test -f target/nasa-core-spring-boot-aot-1.0.4-javadoc.jar
